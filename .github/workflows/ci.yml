name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Dummy values only. These are baked into the client bundle at build time;
# the e2e suite intercepts every request to this URL with an in-memory fake
# (e2e/fake-supabase.ts). No real key ever reaches CI.
env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: lint · typecheck · unit · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the secret scan reads every commit in the range.
          fetch-depth: 0

      # The pre-commit hook only guards clones that enabled it; this enforces
      # the same scan on everything that reaches GitHub. It reads every line
      # added by every commit of the PR (or push), so a key committed and then
      # deleted still fails. A new branch, or a push whose old head is gone,
      # is scanned against master.
      - name: Secret scan
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$GITHUB_SHA"
          else
            range="origin/master..$GITHUB_SHA"
          fi
          sh .githooks/pre-commit --range "$range"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Production dependencies only: dev tooling never ships to a till.
      # A new high/critical advisory in what we deploy fails the build.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright, Chromium, offline)
        run: npm run test:e2e
        env:
          CI: 'true'
          E2E_SKIP_BUILD: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
